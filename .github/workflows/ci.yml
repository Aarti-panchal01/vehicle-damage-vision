name: Project CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check --line-length 120 src/vision eval scripts tests
      - name: Check Contract A schema file is up to date
        run: python -m scripts.export_contract_schema --check
      - name: Unit tests (API calls mocked)
        run: python -m pytest -q
